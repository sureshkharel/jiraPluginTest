name: E2E Tests

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

  workflow_dispatch:
    inputs:
      project_key:
        description: 'Jira project key'
        required: false
        type: string

      issue_key:
        description: 'Jira issue key'
        required: false
        type: string

      jira_base_url:
        description: 'Jira base URL'
        required: false
        type: string

      testops_environment:
        description: 'TestOps environment'
        required: false
        type: string

      scenario_id:
        description: 'TestOps scenario ID'
        required: false
        type: string

      scenario_ref:
        description: 'TestOps scenario reference'
        required: false
        type: string

      scenario_ordinal:
        description: 'Scenario ordinal'
        required: false
        type: string

      scenario_name:
        description: 'BDD scenario name'
        required: false
        type: string

      feature_name:
        description: 'BDD feature name'
        required: false
        type: string

      steps:
        description: 'BDD scenario steps'
        required: false
        type: string

jobs:
  test:
    name: Run Cucumber E2E Tests
    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run selected Cucumber scenario
        id: cucumber
        run: |
          if [ -n "${{ inputs.scenario_name }}" ]; then
            echo "Running selected scenario: ${{ inputs.scenario_name }}"
            npx cucumber-js --name "${{ inputs.scenario_name }}"
          else
            echo "No scenario supplied. Running complete test suite."
            npm test
          fi
        env:
          CI: true

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: cucumber-test-results
          path: reports/
          retention-days: 14

      - name: Report scenario automation status to TestOps
        if: ${{ github.event_name == 'workflow_dispatch' && always() }}
        env:
          TESTOPS_FORGE_ENDPOINT: ${{ secrets.TESTOPS_FORGE_ENDPOINT }}
          TESTOPS_FORGE_AUTH_TOKEN: ${{ secrets.TESTOPS_FORGE_AUTH_TOKEN }}
          TESTOPS_PROJECT_KEY: ${{ inputs.project_key }}
          TESTOPS_SCENARIO_REF: ${{ inputs.scenario_ref }}
          TESTOPS_STATUS: ${{ job.status == 'success' && 'passed' || job.status == 'cancelled' && 'cancelled' || 'failed' }}
        run: |
          echo "Reporting scenario status: $TESTOPS_STATUS"
          echo "Scenario ref: $TESTOPS_SCENARIO_REF"

          curl -sS "$TESTOPS_FORGE_ENDPOINT" \
            -H "authorization: Bearer $TESTOPS_FORGE_AUTH_TOKEN" \
            -H "content-type: application/json" \
            -d "{
              \"contract\":\"updateScenarioAutomationStatus\",
              \"payload\":{
                \"context\":{
                  \"projectKey\":\"$TESTOPS_PROJECT_KEY\"
                },
                \"scenarioRef\":\"$TESTOPS_SCENARIO_REF\",
                \"status\":\"$TESTOPS_STATUS\",
                \"externalRunId\":\"${GITHUB_RUN_ID}\",
                \"externalRunUrl\":\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\",
                \"responseStatus\":200,
                \"responseSnippet\":\"GitHub Actions callback from ${GITHUB_WORKFLOW}\"
              }
            }"